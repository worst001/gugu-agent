<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #2f241d; }
      .title { font-size: 34px; font-weight: 800; }
      .note { font-size: 16px; fill: #8c6d58; }
      .panel-title { font-size: 24px; font-weight: 800; }
      .panel-note { font-size: 14px; fill: #8c6d58; }
      .label { font-size: 14px; font-weight: 700; fill: #6f5140; }
      .small { font-size: 13px; fill: #8c6d58; }
      .icon { font-family: Arial, sans-serif; font-size: 28px; fill: #7a5c48; }
      .soft { fill: #fffaf3; stroke: #e9c9aa; stroke-width: 1.4; }
      .composer { fill: #fffdf9; stroke: #e7b991; stroke-width: 2; filter: url(#shadow); }
      .line { stroke: #e4c7ac; stroke-width: 1; }
      .pill { fill: #fffaf4; stroke: #dfc3a9; stroke-width: 1.4; }
      .chip { fill: #fff3df; stroke: #e4bd93; stroke-width: 1.2; }
      .send { fill: #efc3ad; }
      .menu { fill: #fffaf4; stroke: #dec0a4; stroke-width: 1.2; filter: url(#shadow); }
      .muted { fill: #9b806d; }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#b47a52" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="#fbf3e6"/>
  <text x="64" y="76" class="title">工具箱位置方案</text>
  <text x="64" y="108" class="note">围绕当前输入框做最小调整：不增加新导航，不和模型/权限/发送抢主位置。</text>

  <!-- Panel A -->
  <g transform="translate(64 150)">
    <rect class="soft" width="704" height="340" rx="24"/>
    <text x="28" y="48" class="panel-title">A. 右侧任务胶囊</text>
    <text x="28" y="76" class="panel-note">保留现在位置，但缩短、弱化，让发送按钮仍是视觉终点。</text>
    <rect class="composer" x="38" y="138" width="628" height="142" rx="22"/>
    <text x="60" y="178" class="small">让 Gugu 编辑、调试或解释代码...</text>
    <line class="line" x1="60" y1="215" x2="642" y2="215"/>
    <text x="64" y="256" class="icon">+</text>
    <text x="106" y="256" class="icon">✦</text>
    <text x="148" y="256" class="icon">◉</text>
    <circle cx="196" cy="247" r="18" fill="#f7ead8"/>
    <text x="187" y="256" class="icon" style="font-size:24px">⚡</text>
    <rect class="pill" x="436" y="226" width="110" height="42" rx="21"/>
    <text x="464" y="252" class="label">工具箱</text>
    <text x="526" y="252" class="label">⌄</text>
    <circle class="send" cx="608" cy="247" r="24"/>
    <text x="599" y="257" font-size="28" font-weight="800" fill="#fff">→</text>
  </g>

  <!-- Panel B -->
  <g transform="translate(832 150)">
    <rect class="soft" width="704" height="340" rx="24"/>
    <text x="28" y="48" class="panel-title">B. 放进 + 菜单</text>
    <text x="28" y="76" class="panel-note">底栏最干净；选中后用小标签提示本次任务。</text>
    <rect class="composer" x="38" y="138" width="628" height="142" rx="22"/>
    <rect class="chip" x="58" y="154" width="104" height="28" rx="14"/>
    <text x="78" y="173" class="small">总结文档 ×</text>
    <text x="60" y="205" class="small">把这段内容整理成 PDF...</text>
    <line class="line" x1="60" y1="215" x2="642" y2="215"/>
    <text x="64" y="256" class="icon">+</text>
    <rect class="menu" x="54" y="268" width="178" height="116" rx="14"/>
    <text x="76" y="298" class="small">添加文件</text>
    <text x="76" y="326" class="small">计划 / CE</text>
    <text x="76" y="354" class="small">工具箱</text>
    <circle cx="196" cy="247" r="18" fill="#f7ead8"/>
    <text x="187" y="256" class="icon" style="font-size:24px">⚡</text>
    <rect class="pill" x="482" y="226" width="72" height="42" rx="21"/>
    <text x="503" y="252" class="label">默认</text>
    <circle class="send" cx="608" cy="247" r="24"/>
    <text x="599" y="257" font-size="28" font-weight="800" fill="#fff">→</text>
  </g>

  <!-- Panel C -->
  <g transform="translate(64 548)">
    <rect class="soft" width="704" height="340" rx="24"/>
    <text x="28" y="48" class="panel-title">C. 输入区内轻量选择器</text>
    <text x="28" y="76" class="panel-note">工具箱像“本次目的”，放在文本区和底栏之间，认知最明确。</text>
    <rect class="composer" x="38" y="138" width="628" height="154" rx="22"/>
    <text x="60" y="176" class="small">随便问点什么...</text>
    <rect class="chip" x="230" y="190" width="190" height="34" rx="17"/>
    <text x="264" y="212" class="label">工具箱：处理文件</text>
    <line class="line" x1="60" y1="232" x2="642" y2="232"/>
    <text x="64" y="272" class="icon">+</text>
    <text x="106" y="272" class="icon">✦</text>
    <text x="148" y="272" class="icon">◉</text>
    <circle cx="196" cy="263" r="18" fill="#f7ead8"/>
    <text x="187" y="272" class="icon" style="font-size:24px">⚡</text>
    <rect class="pill" x="482" y="242" width="72" height="42" rx="21"/>
    <text x="503" y="268" class="label">默认</text>
    <circle class="send" cx="608" cy="263" r="24"/>
    <text x="599" y="273" font-size="28" font-weight="800" fill="#fff">→</text>
  </g>

  <!-- Panel D -->
  <g transform="translate(832 548)">
    <rect class="soft" width="704" height="340" rx="24"/>
    <text x="28" y="48" class="panel-title">D. 左侧图标入口</text>
    <text x="28" y="76" class="panel-note">工具箱靠近 +，像输入增强工具；右侧只保留模型和发送。</text>
    <rect class="composer" x="38" y="138" width="628" height="142" rx="22"/>
    <rect class="chip" x="58" y="154" width="98" height="28" rx="14"/>
    <text x="80" y="173" class="small">写邮件 ×</text>
    <text x="60" y="205" class="small">把这段话整理成正式邮件...</text>
    <line class="line" x1="60" y1="215" x2="642" y2="215"/>
    <text x="64" y="256" class="icon">+</text>
    <rect class="pill" x="98" y="225" width="42" height="42" rx="21"/>
    <text x="109" y="253" class="icon" style="font-size:22px">▣</text>
    <text x="154" y="256" class="icon">✦</text>
    <text x="196" y="256" class="icon">◉</text>
    <circle cx="244" cy="247" r="18" fill="#f7ead8"/>
    <text x="235" y="256" class="icon" style="font-size:24px">⚡</text>
    <rect class="menu" x="94" y="270" width="164" height="104" rx="14"/>
    <text x="116" y="300" class="small">总结文档</text>
    <text x="116" y="328" class="small">分析表格</text>
    <text x="116" y="356" class="small">处理文件</text>
    <rect class="pill" x="482" y="226" width="72" height="42" rx="21"/>
    <text x="503" y="252" class="label">默认</text>
    <circle class="send" cx="608" cy="247" r="24"/>
    <text x="599" y="257" font-size="28" font-weight="800" fill="#fff">→</text>
  </g>
</svg>
