<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#8b5d35" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8f2e7; }
      .panel { fill: #fffaf2; stroke: #e5caa7; stroke-width: 1.4; }
      .soft { fill: #f4eadc; }
      .line { stroke: #e0c5a0; stroke-width: 1; }
      .title { font: 700 22px "Microsoft YaHei", sans-serif; fill: #2c2118; }
      .label { font: 600 15px "Microsoft YaHei", sans-serif; fill: #3f2d20; }
      .muted { font: 13px "Microsoft YaHei", sans-serif; fill: #8c6d51; }
      .tiny { font: 12px "Microsoft YaHei", sans-serif; fill: #a17c5a; }
      .icon { font: 20px "Segoe UI Symbol", "Microsoft YaHei", sans-serif; fill: #7a5338; }
      .accent { fill: #a65b2b; }
      .chip { fill: #fffdf8; stroke: #dcb98d; stroke-width: 1; }
      .selected { fill: #b76533; }
      .selectedText { font: 600 13px "Microsoft YaHei", sans-serif; fill: #fffaf2; }
      .chipText { font: 600 13px "Microsoft YaHei", sans-serif; fill: #5e3f29; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="920"/>
  <text x="54" y="56" class="title">右侧工作台收起态：隐藏内容，但保留轻入口</text>
  <text x="54" y="82" class="muted">目标：不要常驻右侧宽栏；用户仍能发现“审查 / 终端 / 文件”。</text>

  <g transform="translate(45,120)">
    <rect class="panel" width="440" height="720" rx="22" filter="url(#shadow)"/>
    <text x="28" y="44" class="title">A1 顶部轻工具</text>
    <text x="28" y="70" class="muted">推荐：最像 Codex，入口固定但不占右栏</text>
    <rect x="28" y="96" width="384" height="560" rx="14" fill="#fbf5ea" stroke="#ecd6b8"/>
    <rect x="28" y="96" width="384" height="42" rx="14" fill="#fffaf2"/>
    <line x1="28" y1="138" x2="412" y2="138" class="line"/>
    <circle cx="58" cy="117" r="7" fill="#d97345"/>
    <circle cx="80" cy="117" r="7" fill="#e2b55c"/>
    <circle cx="102" cy="117" r="7" fill="#87b66a"/>
    <rect x="258" y="106" width="118" height="25" rx="12" class="chip"/>
    <text x="277" y="124" class="chipText">▣ 工作台</text>
    <text x="382" y="124" class="icon">⌄</text>
    <rect x="63" y="184" width="310" height="66" rx="16" fill="#fff1c9"/>
    <text x="91" y="223" class="label">用户消息 / 工具结果区域</text>
    <rect x="72" y="570" width="288" height="48" rx="16" fill="#fffaf2" stroke="#e6caa8"/>
    <text x="96" y="600" class="muted">输入框</text>
    <rect x="286" y="582" width="54" height="26" rx="13" class="selected"/>
    <text x="299" y="600" class="selectedText">运行</text>
    <g transform="translate(248,142)">
      <rect width="128" height="126" rx="14" fill="#fffdf8" stroke="#ddb98e"/>
      <text x="16" y="32" class="chipText">☑ 审查</text>
      <text x="16" y="66" class="chipText">▣ 终端</text>
      <text x="16" y="100" class="chipText">▱ 文件</text>
    </g>
    <text x="28" y="690" class="label">适合：常用入口、可发现性最好</text>
  </g>

  <g transform="translate(530,120)">
    <rect class="panel" width="440" height="720" rx="22" filter="url(#shadow)"/>
    <text x="28" y="44" class="title">B1 边缘轻触发</text>
    <text x="28" y="70" class="muted">最隐藏：右侧只留 6px 热区，hover 才出现</text>
    <rect x="28" y="96" width="384" height="560" rx="14" fill="#fbf5ea" stroke="#ecd6b8"/>
    <rect x="28" y="96" width="384" height="42" rx="14" fill="#fffaf2"/>
    <line x1="28" y1="138" x2="412" y2="138" class="line"/>
    <rect x="405" y="96" width="7" height="560" rx="3.5" fill="#cda37a"/>
    <rect x="282" y="270" width="108" height="34" rx="17" fill="#2b211a" opacity="0.9"/>
    <text x="300" y="292" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fffaf2">打开工作台</text>
    <circle cx="408" cy="287" r="12" fill="#a65b2b"/>
    <text x="401" y="294" font-family="Segoe UI Symbol" font-size="16" fill="#fffaf2">›</text>
    <rect x="63" y="184" width="310" height="66" rx="16" fill="#fff1c9"/>
    <text x="91" y="223" class="label">用户消息 / 工具结果区域</text>
    <rect x="72" y="570" width="288" height="48" rx="16" fill="#fffaf2" stroke="#e6caa8"/>
    <text x="96" y="600" class="muted">输入框</text>
    <text x="28" y="690" class="label">适合：高级用户；小白可能找不到</text>
  </g>

  <g transform="translate(1015,120)">
    <rect class="panel" width="440" height="720" rx="22" filter="url(#shadow)"/>
    <text x="28" y="44" class="title">C1 浮动工作台</text>
    <text x="28" y="70" class="muted">入口跟随内容区，打开后展开三项</text>
    <rect x="28" y="96" width="384" height="560" rx="14" fill="#fbf5ea" stroke="#ecd6b8"/>
    <rect x="28" y="96" width="384" height="42" rx="14" fill="#fffaf2"/>
    <line x1="28" y1="138" x2="412" y2="138" class="line"/>
    <rect x="63" y="184" width="310" height="66" rx="16" fill="#fff1c9"/>
    <text x="91" y="223" class="label">用户消息 / 工具结果区域</text>
    <rect x="72" y="570" width="288" height="48" rx="16" fill="#fffaf2" stroke="#e6caa8"/>
    <text x="96" y="600" class="muted">输入框</text>
    <g transform="translate(228,492)">
      <rect width="138" height="42" rx="21" fill="#fffdf8" stroke="#ddb98e"/>
      <text x="22" y="27" class="chipText">▣ 工作台</text>
      <text x="112" y="27" class="icon">⌄</text>
    </g>
    <g transform="translate(214,356)">
      <rect width="166" height="126" rx="16" fill="#fffdf8" stroke="#ddb98e"/>
      <text x="20" y="34" class="chipText">☑ 审查</text>
      <text x="20" y="70" class="chipText">▣ 终端</text>
      <text x="20" y="106" class="chipText">▱ 文件</text>
    </g>
    <text x="28" y="690" class="label">适合：显眼但不抢顶部空间</text>
  </g>
</svg>
