<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .page { fill: #f6efe5; }
      .panel { fill: #fffaf2; stroke: #dfc9ad; stroke-width: 1.5; }
      .chrome { fill: #fbf6ee; stroke: #e6d5bd; stroke-width: 1; }
      .dark-panel { fill: #141313; stroke: #34302b; stroke-width: 1.5; }
      .dark-chrome { fill: #191817; stroke: #332d28; stroke-width: 1; }
      .sidebar { fill: #fdf8ef; stroke: #e5d1b7; stroke-width: 1; }
      .sidebar-soft { fill: #fffaf4; stroke: #ead8c0; stroke-width: 1; }
      .sidebar-dark { fill: #171514; stroke: #342e28; stroke-width: 1; }
      .main { fill: #f8f1e7; }
      .main-dark { fill: #101010; }
      .tab { fill: #fff9ef; stroke: #e8d5bb; stroke-width: 1; }
      .tab-active { fill: #fff2d2; stroke: #c87535; stroke-width: 1.2; }
      .ink { fill: #2e241e; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .muted { fill: #8d765f; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .faint { fill: #b19b82; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .white { fill: #f6efe5; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .dark-muted { fill: #a99b8f; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .accent { fill: #a2562c; }
      .line { stroke: #e2cfb5; stroke-width: 1; }
      .line-dark { stroke: #312b26; stroke-width: 1; }
      .pill { fill: #f3e6d4; }
      .pill-dark { fill: #27211d; }
      .green { fill: #42b36a; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
      .item { font-size: 17px; }
      .mono { font-family: Consolas, "Microsoft YaHei", monospace; }
    </style>
  </defs>

  <rect class="page" width="1800" height="1100"/>
  <text class="ink title" x="56" y="58">Gugu Agent 展开侧栏方向预览</text>
  <text class="muted small" x="56" y="88">目标：展开后不再保留旧“大标题 + 设置式侧栏”惯性，改成更像工作台的入口、项目和对话导航。</text>

  <!-- Panel A -->
  <g transform="translate(56 130)">
    <rect class="panel" width="820" height="430" rx="22"/>
    <text class="ink label" x="28" y="42">A. Codex-like 工作台侧栏</text>
    <text class="muted tiny" x="28" y="68">最推荐：左上工具区归顶部，侧栏只保留“入口 + 置顶 + 项目”。</text>

    <rect class="chrome" x="28" y="90" width="764" height="302" rx="14"/>
    <rect class="sidebar-dark" x="28" y="90" width="238" height="302" rx="14"/>
    <rect class="dark-chrome" x="266" y="90" width="526" height="36" rx="0"/>
    <text class="white tiny" x="48" y="116">▣</text>
    <text class="dark-muted tiny" x="84" y="116">←</text>
    <text class="dark-muted tiny" x="118" y="116">→</text>
    <text class="dark-muted tiny" x="154" y="116">文件</text>
    <text class="dark-muted tiny" x="198" y="116">编辑</text>
    <text class="dark-muted tiny" x="242" y="116">视图</text>

    <text class="white item" x="48" y="155">✎  新对话</text>
    <text class="white item" x="48" y="190">⌕  搜索</text>
    <text class="white item" x="48" y="225">◌  插件</text>
    <text class="white item" x="48" y="260">◴  自动化</text>
    <text class="dark-muted section" x="48" y="306">置顶</text>
    <text class="white tiny" x="48" y="337">推广文案梳理</text>
    <text class="dark-muted tiny" x="210" y="337">7 分</text>
    <text class="white tiny" x="48" y="365">项目修改 gugu</text>
    <text class="dark-muted tiny" x="206" y="365">2 天</text>

    <rect class="main-dark" x="266" y="126" width="526" height="266"/>
    <rect class="pill-dark" x="294" y="150" width="250" height="32" rx="16"/>
    <text class="white tiny" x="315" y="171">📌 项目修改 gugu</text>
    <text class="dark-muted tiny" x="294" y="215">这里是主工作区，左侧已从“品牌面板”变成“导航面板”。</text>
    <line class="line-dark" x1="294" y1="240" x2="760" y2="240"/>
    <text class="dark-muted tiny" x="294" y="275">优点：收起/展开逻辑最干净，用户能快速理解。</text>
  </g>

  <!-- Panel B -->
  <g transform="translate(924 130)">
    <rect class="panel" width="820" height="430" rx="22"/>
    <text class="ink label" x="28" y="42">B. Gugu 轻品牌侧栏</text>
    <text class="muted tiny" x="28" y="68">保留一点品牌感，但去掉大标题和旧设置区。</text>

    <rect class="chrome" x="28" y="90" width="764" height="302" rx="14"/>
    <rect class="sidebar" x="28" y="90" width="260" height="302" rx="14"/>
    <circle cx="58" cy="121" r="16" fill="#f4c071" stroke="#a2562c"/>
    <text class="ink tiny" x="84" y="127">Gugu</text>
    <text class="faint tiny" x="236" y="127">‹</text>
    <line class="line" x1="44" y1="145" x2="272" y2="145"/>

    <text class="ink item" x="52" y="178">＋ 新建</text>
    <text class="ink item" x="52" y="212">⌕ 搜索会话</text>
    <text class="ink item" x="52" y="246">▤ 定时任务</text>
    <text class="muted section" x="52" y="292">置顶</text>
    <rect class="pill" x="46" y="306" width="220" height="30" rx="9"/>
    <text class="ink tiny" x="58" y="326">会议主题：AI 谷子...</text>
    <text class="faint tiny" x="52" y="360">项目</text>
    <text class="ink tiny" x="72" y="382">📁 claude-code-gugu</text>

    <rect class="main" x="288" y="90" width="504" height="302"/>
    <rect class="tab-active" x="310" y="112" width="210" height="42" rx="8"/>
    <text class="ink tiny" x="328" y="138">## 第四课...</text>
    <text class="muted tiny" x="324" y="205">优点：保留产品识别；缺点：比 A 更像传统 app。</text>
  </g>

  <!-- Panel C -->
  <g transform="translate(56 610)">
    <rect class="panel" width="820" height="430" rx="22"/>
    <text class="ink label" x="28" y="42">C. 顶部拥有全局控制</text>
    <text class="muted tiny" x="28" y="68">“文件/编辑/视图/帮助”和窗口控制都在顶栏，侧栏从快速入口开始。</text>

    <rect class="chrome" x="28" y="90" width="764" height="302" rx="14"/>
    <rect class="sidebar-soft" x="28" y="126" width="238" height="266"/>
    <rect class="chrome" x="28" y="90" width="764" height="36"/>
    <text class="ink tiny" x="48" y="114">▣</text>
    <text class="muted tiny" x="86" y="114">文件</text>
    <text class="muted tiny" x="130" y="114">编辑</text>
    <text class="muted tiny" x="174" y="114">视图</text>
    <text class="muted tiny" x="218" y="114">帮助</text>
    <text class="muted tiny" x="732" y="114">—  □  ×</text>

    <text class="muted section" x="50" y="158">快速入口</text>
    <text class="ink item" x="50" y="192">✎  新对话</text>
    <text class="ink item" x="50" y="226">⌕  搜索</text>
    <text class="ink item" x="50" y="260">▦  已归档</text>
    <line class="line" x1="48" y1="284" x2="246" y2="284"/>
    <text class="muted section" x="50" y="315">项目</text>
    <text class="ink tiny" x="50" y="347">📁 文案策划师</text>
    <text class="ink tiny" x="50" y="376">📁 选品分析师</text>

    <rect class="main" x="266" y="126" width="526" height="266"/>
    <text class="ink tiny" x="302" y="180">主区域不再被旧侧栏视觉挤压。</text>
    <text class="muted tiny" x="302" y="215">优点：层级最稳，顶部菜单和侧栏职责清晰。</text>
  </g>

  <!-- Panel D -->
  <g transform="translate(924 610)">
    <rect class="panel" width="820" height="430" rx="22"/>
    <text class="ink label" x="28" y="42">D. 极简生产力侧栏</text>
    <text class="muted tiny" x="28" y="68">更密集，适合重度用户；普通用户可能觉得偏硬。</text>

    <rect class="chrome" x="28" y="90" width="764" height="302" rx="14"/>
    <rect class="sidebar-dark" x="28" y="90" width="280" height="302" rx="14"/>
    <rect x="28" y="90" width="44" height="302" fill="#201b18" rx="14"/>
    <text class="white tiny" x="46" y="124">☰</text>
    <text class="dark-muted tiny" x="46" y="166">＋</text>
    <text class="dark-muted tiny" x="46" y="208">⌕</text>
    <text class="dark-muted tiny" x="46" y="250">▤</text>
    <text class="dark-muted tiny" x="46" y="292">⚙</text>

    <text class="white section" x="92" y="126">置顶项目</text>
    <text class="white tiny" x="92" y="160">文案策划师</text>
    <text class="dark-muted tiny" x="250" y="160">8</text>
    <text class="white tiny" x="92" y="190">选品分析师</text>
    <text class="dark-muted tiny" x="250" y="190">4</text>
    <line class="line-dark" x1="92" y1="212" x2="278" y2="212"/>
    <text class="dark-muted section" x="92" y="245">最近对话</text>
    <text class="white tiny" x="92" y="278">工作日志</text>
    <text class="dark-muted tiny" x="232" y="278">25m</text>
    <text class="white tiny" x="92" y="308">会议总结</text>
    <text class="dark-muted tiny" x="238" y="308">2h</text>

    <rect class="main-dark" x="308" y="90" width="484" height="302"/>
    <text class="dark-muted tiny" x="340" y="152">优点：信息密度最高；适合后续快捷键和多项目重度使用。</text>
  </g>
</svg>
